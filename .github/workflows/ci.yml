name: Verify release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install CPU runtime and backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Installer regressions
        run: python -m unittest discover -s backend -p test_installer.py -v
      - name: Application regressions
        run: python -m unittest discover -s backend -p test_performance.py -v
      - name: Priority regressions
        run: python -m unittest discover -s backend -p test_priority.py -v
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify runtime without model downloads
        run: python backend/installer.py --check-only --skip-model --no-launch --no-pause
